<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Results Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-5px);
        }

        .summary-card .number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .summary-card .label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .success { color: #27ae60; }
        .warning { color: #f39c12; }
        .error { color: #e74c3c; }
        .info { color: #3498db; }

        .endpoint-section {
            padding: 30px;
            border-top: 1px solid #eee;
        }

        .endpoint-header {
            background: #34495e;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .endpoint-url {
            font-size: 1.2em;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .endpoint-meta {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .test-results {
            display: grid;
            gap: 15px;
        }

        .test-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .test-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .test-header {
            display: flex;
            align-items: center;
            padding: 20px;
            cursor: pointer;
            background: #fafafa;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
            margin-right: 20px;
            min-width: 120px;
        }

        .status-badge.matched {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.unmatched {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-icon {
            font-size: 1.2em;
        }

        .test-details {
            flex: 1;
        }

        .expected-vs-actual {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
        }

        .expected, .actual {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .test-body {
            display: none;
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #f9f9f9;
        }

        .test-body.active {
            display: block;
        }

        .request-response {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .code-block {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.85em;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        .code-title {
            background: #34495e;
            color: white;
            padding: 10px 15px;
            margin: -15px -15px 15px -15px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .expand-icon {
            margin-left: auto;
            transition: transform 0.3s ease;
        }

        .test-header[aria-expanded="true"] .expand-icon {
            transform: rotate(180deg);
        }

        .file-upload {
            margin: 20px 30px;
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            text-align: center;
            background: #fafafa;
        }

        .file-upload input {
            display: none;
        }

        .file-upload label {
            display: inline-block;
            padding: 12px 24px;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .file-upload label:hover {
            background: #2980b9;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        @media (max-width: 768px) {
            .summary-cards {
                grid-template-columns: 1fr 1fr;
            }
            
            .request-response {
                grid-template-columns: 1fr;
            }
            
            .endpoint-meta {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 API Test Results Dashboard</h1>
            <div class="subtitle">Global Payments API Response Analysis</div>
        </div>

        <div class="file-upload">
            <input type="file" id="jsonFile" accept=".json">
            <label for="jsonFile">📁 Upload JSON Results File</label>
            <div style="margin-top: 10px; font-size: 0.9em; color: #666;">
                Select your api-responses-*.json file to view results
            </div>
        </div>

        <div id="content">
            <div class="no-data">
                <h3>📊 Ready to Display Results</h3>
                <p>Upload a JSON results file to see your API test analysis</p>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;

        document.getElementById('jsonFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        currentData = JSON.parse(e.target.result);
                        displayResults(currentData);
                    } catch (error) {
                        alert('Error parsing JSON file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        function displayResults(data) {
            const content = document.getElementById('content');
            
            // Determine if it's single or multi-endpoint data
            const isSingleEndpoint = data.endpoint && !data.endpoints;
            const endpoints = isSingleEndpoint ? [data.endpoint] : (data.endpoints || []);
            
            if (endpoints.length === 0) {
                content.innerHTML = `
                    <div class="no-data">
                        <h3>❌ No Data Found</h3>
                        <p>The uploaded file doesn't contain valid endpoint data</p>
                    </div>
                `;
                return;
            }

            // Calculate totals
            let totalTests = 0;
            let totalSuccessful = 0;
            let totalErrors = 0;
            let totalMatched = 0;

            endpoints.forEach(endpoint => {
                if (endpoint.responses) {
                    totalTests += endpoint.responses.length;
                    totalSuccessful += endpoint.responses.filter(r => r.response && !r.error).length;
                    totalErrors += endpoint.responses.filter(r => r.error).length;
                    totalMatched += endpoint.responses.filter(r => r.response && r.response.matched).length;
                }
            });

            const successRate = totalTests > 0 ? Math.round((totalSuccessful / totalTests) * 100) : 0;
            const matchRate = totalTests > 0 ? Math.round((totalMatched / totalTests) * 100) : 0;

            content.innerHTML = `
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="number info">${endpoints.length}</div>
                        <div class="label">Endpoints Tested</div>
                    </div>
                    <div class="summary-card">
                        <div class="number info">${totalTests}</div>
                        <div class="label">Total API Calls</div>
                    </div>
                    <div class="summary-card">
                        <div class="number success">${totalSuccessful}</div>
                        <div class="label">Successful</div>
                    </div>
                    <div class="summary-card">
                        <div class="number warning">${totalTests - totalMatched}</div>
                        <div class="label">Status Mismatches</div>
                    </div>
                    <div class="summary-card">
                        <div class="number error">${totalErrors}</div>
                        <div class="label">Errors</div>
                    </div>
                    <div class="summary-card">
                        <div class="number ${successRate >= 80 ? 'success' : successRate >= 60 ? 'warning' : 'error'}">${successRate}%</div>
                        <div class="label">Success Rate</div>
                    </div>
                </div>

                ${endpoints.map((endpoint, index) => generateEndpointHTML(endpoint, index)).join('')}
            `;

            // Add click handlers for expandable sections
            document.querySelectorAll('.test-header').forEach(header => {
                header.addEventListener('click', function() {
                    const body = this.nextElementSibling;
                    const isExpanded = this.getAttribute('aria-expanded') === 'true';
                    
                    this.setAttribute('aria-expanded', !isExpanded);
                    body.classList.toggle('active');
                });
            });
        }

        function generateEndpointHTML(endpoint, index) {
            const responses = endpoint.responses || [];
            const summary = endpoint.summary || { total: 0, successful: 0, errors: 0 };
            
            return `
                <div class="endpoint-section">
                    <div class="endpoint-header">
                        <div class="endpoint-url">🎯 ${endpoint.endpoint?.url || 'Unknown Endpoint'}</div>
                        <div class="endpoint-meta">
                            <span>📊 ${summary.total} tests</span>
                            <span>✅ ${summary.successful} successful</span>
                            <span>❌ ${summary.errors} errors</span>
                            <span>📅 ${new Date(endpoint.timestamp || Date.now()).toLocaleString()}</span>
                        </div>
                    </div>

                    <div class="test-results">
                        ${responses.map((response, responseIndex) => generateTestItemHTML(response, responseIndex)).join('')}
                    </div>
                </div>
            `;
        }

        function generateTestItemHTML(response, index) {
            const hasError = response.error;
            const isMatched = response.response && response.response.matched;
            const statusCode = response.statusCode;
            const actualStatus = response.response ? response.response.status : 'N/A';
            
            let statusBadgeClass = 'matched';
            let statusIcon = '✅';
            let statusText = 'Expected';
            
            if (hasError) {
                statusBadgeClass = 'error';
                statusIcon = '❌';
                statusText = 'Error';
            } else if (!isMatched) {
                statusBadgeClass = 'unmatched';
                statusIcon = '⚠️';
                statusText = 'Mismatch';
            }

            return `
                <div class="test-item">
                    <div class="test-header" aria-expanded="false">
                        <div class="status-badge ${statusBadgeClass}">
                            <span class="status-icon">${statusIcon}</span>
                            <span>${statusText}</span>
                        </div>
                        <div class="test-details">
                            <div class="expected-vs-actual">
                                <div class="expected">
                                    <strong>Expected:</strong> ${statusCode}
                                </div>
                                <div class="actual">
                                    <strong>Actual:</strong> ${actualStatus} ${response.response?.statusText || ''}
                                </div>
                            </div>
                        </div>
                        <div class="expand-icon">▼</div>
                    </div>
                    <div class="test-body">
                        ${hasError ? `
                            <div style="color: #e74c3c; padding: 20px; background: #fdf2f2; border-radius: 5px; margin-bottom: 20px;">
                                <strong>❌ Error:</strong> ${response.error}
                            </div>
                        ` : ''}
                        
                        <div class="request-response">
                            <div>
                                <div class="code-block">
                                    <div class="code-title">📤 Request</div>
                                    <pre>${response.request ? JSON.stringify({
                                        method: response.request.method,
                                        url: response.request.url,
                                        headers: response.request.headers,
                                        body: response.request.body ? JSON.parse(response.request.body) : null
                                    }, null, 2) : 'No request data'}</pre>
                                </div>
                            </div>
                            <div>
                                <div class="code-block">
                                    <div class="code-title">📥 Response</div>
                                    <pre>${response.response ? JSON.stringify({
                                        status: response.response.status,
                                        statusText: response.response.statusText,
                                        headers: response.response.headers,
                                        body: response.response.body
                                    }, null, 2) : 'No response data'}</pre>
                                </div>
                            </div>
                        </div>
                        
                        <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px;">
                            <strong>🕒 Timestamp:</strong> ${new Date(response.timestamp).toLocaleString()}
                        </div>
                    </div>
                </div>
            `;
        }

        // Auto-load if there's a JSON file in the current directory (for demo purposes)
        // You can modify this to auto-load a specific file
        window.addEventListener('load', function() {
            // This would typically be used with a file server or when the HTML is in the same directory
            // For now, users need to upload the file manually
        });
    </script>

    <!-- Auto-load latest results script -->
    <script src="auto-load-latest-results.js"></script>
</body>
</html>
