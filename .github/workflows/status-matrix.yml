name: Status Matrix

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-matrix:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install deps
        run: npm ci

      - name: Run status matrix (deterministic codes)
        env:
          GP_APP_ID: ${{ secrets.GP_APP_ID }}
          GP_APP_KEY: ${{ secrets.GP_APP_KEY }}
          GP_EXPECT_502_EMPTY: '1'
        run: |
          npm run status:ci

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-dashboard
          path: results-dashboard-autoload.html

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: |
            api-responses-*.json
            DISPUTE_CHALLENGE_TEST_RESULTS.md
            API_ACTION_ANALYSIS.md
